<!doctype html>
<!-- PROTOTYPE (throwaway): renders a heavy Poly Haven tree once, side-on, into a transparent picture
     (?model=jacaranda_tree). Run through headless Chrome (see the prototype commit messages); the scene shows the
     picture on crossed quads. The title reports the picture's width in metres and where the trunk stands in it.
     The tree models aren't committed: download one (glTF, 1k) from Poly Haven into
     public/prototype-monti/models/<id>/ to bake again. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>html, body { margin: 0; background: transparent; }</style>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

      const id = new URLSearchParams(location.search).get('model') ?? 'jacaranda_tree';
      const size = 1024;
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(size, size);
      renderer.setClearColor(0x000000, 0);
      document.body.appendChild(renderer.domElement);

      const gltf = await new GLTFLoader().loadAsync(`${import.meta.env.BASE_URL}prototype-monti/models/${id}/${id}_1k.gltf`);
      const tree = gltf.scene;
      const box = new THREE.Box3().setFromObject(tree);
      const [w, h] = [box.max.x - box.min.x, box.max.y - box.min.y];
      const s = Math.max(w, h);
      const cx = (box.min.x + box.max.x) / 2;
      const camera = new THREE.OrthographicCamera(cx - s / 2, cx + s / 2, box.min.y + s, box.min.y, 0.1, 200);
      camera.position.set(0, 0, 100);

      // Mostly flat light, so the picture is close to albedo: the scene lights the quads again.
      const scene = new THREE.Scene();
      scene.add(tree, new THREE.AmbientLight('#ffffff', 2.2));
      const top = new THREE.DirectionalLight('#ffffff', 1.2);
      top.position.set(0.3, 1, 0.6);
      scene.add(top);
      renderer.render(scene, camera);
      // The model's origin is its trunk foot.
      document.title = `baked span ${s.toFixed(2)} trunk_u ${((0 - (cx - s / 2)) / s).toFixed(3)} w ${w.toFixed(2)} h ${h.toFixed(2)}`;
    </script>
  </body>
</html>
