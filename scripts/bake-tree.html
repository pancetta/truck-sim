<!doctype html>
<!-- Tree baking for `npm run assets` (scripts/assets.js), which serves this page with Vite and screenshots it in
     headless Chrome: the tree model `model` drawn side-on into a `size` px square picture with a transparent
     background, framed by an orthographic camera from `left` and `bottom` over `span` metres. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>html, body { margin: 0; background: transparent; }</style>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

      const q = new URLSearchParams(location.search);
      const [left, bottom, span, size] = ['left', 'bottom', 'span', 'size'].map((k) => Number(q.get(k)));
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(size, size);
      renderer.setClearColor(0x000000, 0);
      document.body.appendChild(renderer.domElement);

      const tree = (await new GLTFLoader().loadAsync(q.get('model'))).scene;
      const camera = new THREE.OrthographicCamera(left, left + span, bottom + span, bottom, 0.1, 1000);
      camera.position.set(0, 0, 500);
      // Mostly flat light, so the picture is close to albedo: the game lights the quads again.
      const scene = new THREE.Scene();
      scene.add(tree, new THREE.AmbientLight('#ffffff', 2.2));
      const top = new THREE.DirectionalLight('#ffffff', 1.2);
      top.position.set(0.3, 1, 0.6);
      scene.add(top);
      renderer.render(scene, camera);
    </script>
  </body>
</html>
